name: Build iOS .ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: traffic-alert-ios/ios-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build & Archive (no signing)
        run: |
          mkdir -p build
          xcodebuild -project TrafficAlert.xcodeproj \
            -scheme TrafficAlert \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrafficAlert.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa (manual)
        run: |
          echo "Creating unsigned .ipa..."
          mkdir -p build/Payload
          cp -r build/TrafficAlert.xcarchive/Products/Applications/TrafficAlert.app build/Payload/
          cd build
          zip -r TrafficAlert.ipa Payload/
          echo "=== Final .ipa ==="
          ls -la TrafficAlert.ipa
          file TrafficAlert.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TrafficAlert.ipa
          path: traffic-alert-ios/ios-app/build/TrafficAlert.ipa
