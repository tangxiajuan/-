name: Build iOS .ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ${{ github.workspace }}/traffic-alert-ios/ios-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode & SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          ls -la Sources/

      - name: List schemes
        run: |
          cd ${{ github.workspace }}/traffic-alert-ios/ios-app
          xcodebuild -list -project TrafficAlert.xcodeproj

      - name: Build app
        run: |
          cd ${{ github.workspace }}/traffic-alert-ios/ios-app
          mkdir -p build
          xcodebuild \
            -project TrafficAlert.xcodeproj \
            -scheme TrafficAlert \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa
        run: |
          cd ${{ github.workspace }}/traffic-alert-ios/ios-app
          APP=$(find build/DerivedData -name "TrafficAlert.app" -type d | head -1)
          echo "Found app: $APP"
          mkdir -p build/Payload
          cp -r "$APP" build/Payload/
          cd build
          zip -r TrafficAlert.ipa Payload/
          ls -la TrafficAlert.ipa
          file TrafficAlert.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TrafficAlert.ipa
          path: traffic-alert-ios/ios-app/build/TrafficAlert.ipa
