name: Build iOS .ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: traffic-alert-ios/ios-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la

      - name: Build & Archive (ad-hoc)
        run: |
          mkdir -p build
          xcodebuild -project TrafficAlert.xcodeproj \
            -scheme TrafficAlert \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TrafficAlert.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export .ipa
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
              <key>uploadBitcode</key>
              <false/>
              <key>compileBitcode</key>
              <false/>
              <key>thinning</key>
              <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/TrafficAlert.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            || echo "Export failed - will package manually"

      - name: Package .ipa manually when export fails
        run: |
          if [ ! -f build/*.ipa ]; then
            echo "Creating unsigned .ipa manually..."
            mkdir -p build/Payload
            cp -r build/TrafficAlert.xcarchive/Products/Applications/TrafficAlert.app build/Payload/
            cd build
            zip -r TrafficAlert.ipa Payload/
            cd ..
            ls -la build/
          fi

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TrafficAlert.ipa
          path: traffic-alert-ios/ios-app/build/*.ipa
